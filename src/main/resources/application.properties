spring.application.name=store

# ================================
# KONFIGURASI POSTGRESQL
# ================================
spring.datasource.pg.jdbc-url=jdbc:postgresql://localhost:5432/stok-anandam-local?reWriteBatchedInserts=true&sslmode=prefer
spring.datasource.pg.username=postgres
# Pakai env DB_PG_PASSWORD jika ada; kalau tidak, pakai default (hanya untuk dev)
spring.datasource.pg.password=${DB_PG_PASSWORD:123}
spring.datasource.pg.driver-class-name=org.postgresql.Driver
spring.datasource.pg.maximum-pool-size=10
spring.datasource.pg.max-lifetime=5400000

# ================================
# MYSQL - MYBIZ REAL-TIME DATABASE
# ================================
app.mysql.enabled=true

migration.legacy-schema=anandamid26
# spring.profiles.active=offline
spring.profiles.active=dev

# ================================
# KONFIGURASI JPA (UMUM)
# ================================
# Default: update + show-sql. Override di application-dev/prod.properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# === OPTIMASI BATCH INSERT (Wajib buat Migrasi) ===
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Khusus Postgres: Menggabungkan insert menjadi satu statement panjang
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# JWT Config - Pakai env JWT_SECRET jika ada; default untuk dev (production wajib set env)
jwt.secret=${JWT_SECRET:KunciRahasiaIniHarusSangatPanjangDanAmanSekali32KarakterLebih}
# 90 Menit
jwt.expiration=5400000

# Refresh Token: Umur 90 Menit juga agar benar-benar logout
jwt.refresh-expiration=5400000

# ================================
# ACTUATOR (health & info untuk ops/monitoring)
# ================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ================================
# OPENAPI / SWAGGER
# ================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Tutup koneksi yang tidak dipakai setelah 30 detik (30000ms)
spring.datasource.hikari.idle-timeout=30000
# Pastikan max-lifetime lebih besar dari idle-timeout
spring.datasource.hikari.max-lifetime=60000

# Batasi jumlah koneksi agar server MyBiz tidak pusing
spring.datasource.mysql.maximum-pool-size=5
spring.datasource.mysql.minimum-idle=2
spring.datasource.mysql.idle-timeout=30000
spring.datasource.mysql.connection-timeout=5400000
spring.datasource.mysql.max-lifetime=1800000
spring.datasource.mysql.leak-detection-threshold=2000
spring.cloud.gcp.credentials.location=file:./service_account.json