spring.application.name=store

# ================================
# KONFIGURASI POSTGRESQL (Database Utama)
# ================================
# Di server: set env DB_PG_HOST, DB_PG_PORT, DB_PG_NAME, DB_PG_USER, DB_PG_PASSWORD
spring.datasource.pg.jdbc-url=jdbc:postgresql://${DB_PG_HOST:192.168.1.176}:${DB_PG_PORT:5432}/${DB_PG_NAME:stok-anandam}?reWriteBatchedInserts=true&sslmode=prefer
spring.datasource.pg.username=${DB_PG_USER:anandamstok}
spring.datasource.pg.password=${DB_PG_PASSWORD:Letmein99+}
spring.datasource.pg.driver-class-name=org.postgresql.Driver
spring.datasource.pg.maximum-pool-size=10
spring.datasource.pg.max-lifetime=5400000


