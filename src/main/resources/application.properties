# ================================
# KONFIGURASI MYSQL (MyBiz Real-Time)
# ================================
# Di server: set env DB_MYSQL_HOST, DB_MYSQL_PORT, DB_MYSQL_NAME, DB_MYSQL_USER, DB_MYSQL_PASSWORD
# Set APP_MYSQL_ENABLED=false di server jika tidak butuh MySQL
app.mysql.enabled=${APP_MYSQL_ENABLED:true}

spring.datasource.mysql.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.mysql.jdbc-url=jdbc:mysql://${DB_MYSQL_HOST:192.168.1.246}:${DB_MYSQL_PORT:3307}/${DB_MYSQL_NAME:anandamid26}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.mysql.username=${DB_MYSQL_USER:root}
spring.datasource.mysql.password=${DB_MYSQL_PASSWORD:}

# Pool MySQL
spring.datasource.mysql.maximum-pool-size=5
spring.datasource.mysql.minimum-idle=0
spring.datasource.mysql.idle-timeout=600000
spring.datasource.mysql.connection-timeout=60000
spring.datasource.mysql.max-lifetime=1800000
spring.datasource.mysql.leak-detection-threshold=2000

migration.legacy-schema=${MIGRATION_LEGACY_SCHEMA:anandamid26}

# ================================
# KONFIGURASI JPA (UMUM)
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Logging: default WARN, di dev bisa override via env
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.stok.anandam=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE:WARN}
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:WARN}

# === OPTIMASI BATCH INSERT (Wajib buat Migrasi) ===
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# ================================
# JWT Config
# ================================
jwt.secret=${JWT_SECRET:KunciRahasiaIniHarusSangatPanjangDanAmanSekali32KarakterLebih}
jwt.expiration=5400000
jwt.refresh-expiration=604800000

# ================================
# ACTUATOR
# ================================
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when_authorized}

# ================================
# OPENAPI / SWAGGER
# ================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ================================
# HIKARI POOL (UMUM/POSTGRES)
# ================================
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# ================================
# GOOGLE CLOUD
# ================================
spring.cloud.gcp.credentials.location=file:./service_account.json

server.port=9099

# ================================
# IN-APP UPDATE (API Key untuk GitHub Actions)
# ================================
app.internal-api-key=${INTERNAL_API_KEY:KUNCIRAHASIAJANGANSAMPAIORANGLAINTAU2026}