migration.legacy-schema=${MIGRATION_LEGACY_SCHEMA:anandamid26}

# ================================
# KONFIGURASI JPA (UMUM)
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Logging: default WARN, di dev bisa override via env
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.stok.anandam=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE:WARN}
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:WARN}

# === OPTIMASI BATCH INSERT (Wajib buat Migrasi) ===
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# ================================
# JWT Config
# ================================
jwt.secret=${JWT_SECRET:KunciRahasiaIniHarusSangatPanjangDanAmanSekali32KarakterLebih}
jwt.expiration=5400000
jwt.refresh-expiration=604800000

# ================================
# ACTUATOR
# ================================
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when_authorized}

# ================================
# OPENAPI / SWAGGER
# ================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ================================
# HIKARI POOL (UMUM)
# ================================

# Setingan Lama (Di-comment karena nilai max-lifetime 60 detik berbahaya)
# spring.datasource.hikari.idle-timeout=30000
# spring.datasource.hikari.max-lifetime=60000
# spring.datasource.hikari.minimum-idle=0

# Setingan Baru (Aman & Stabil)
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000

